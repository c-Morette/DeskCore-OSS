worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    server_tokens off;

    # Uploads: limite acima do limite real da API (10MB arquivo / 12MB request).
    client_max_body_size 15m;

    # Necessário para o WebSocket do Blazor Server (SignalR /_blazor).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream deskcore_web { server deskcore-web:8080; }
    upstream deskcore_api { server deskcore-api:8080; }

    # HTTP -> HTTPS (e desafio ACME do Let's Encrypt).
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — mesma origem: / -> Web, /api/ -> API.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # API direta (opcional; o BFF do Web já fala com a API pela rede interna).
        location /api/ {
            proxy_pass         http://deskcore_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Web (Blazor Server) — inclui upgrade de WebSocket.
        location / {
            proxy_pass         http://deskcore_web;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_buffering    off;
            proxy_read_timeout 100s;
        }
    }
}
